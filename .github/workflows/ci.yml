# CI for a multi-module repository.
#
# Three things drive the shape of this file, and each was learned the expensive
# way somewhere in this ecosystem:
#
#   1. `go test ./...` at the root does NOT descend into redisstore/. Go
#      resolves per module, so every job runs per module or the satellite is
#      simply never built.
#   2. Inside a workspace, a satellite's `require` on the core is inert. That
#      is what makes local development work and what shipped moat's
#      redisstore/v0.2.0 broken. The `satellite-resolution` job is the one that
#      would have been red, and it is the only job here that runs with the
#      workspace off.
#   3. Every tool is pinned to an exact version. `tool@latest` in CI is not
#      reproducible -- today's green build says nothing about tomorrow's -- and
#      it hands whoever controls that tool's repository code execution in this
#      pipeline. In a library that markets a minimal dependency surface as a
#      security property, that would be indefensible.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Weekly, so a newly published vulnerability is found by govulncheck rather
    # than by a user.
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The library floor (NFR-02). Build and test happen here, because this is the
  # version the module promises its importers.
  GO_VERSION: "1.24"
  # The newest supported toolchain. govulncheck runs here: a library verified
  # only at its floor is scanned against a standard library that no longer
  # receives fixes, which reports findings no change to this repository can
  # resolve.
  GO_SUPPORTED_VERSION: "stable"
  # golangci-lint typechecks against the stdlib of the toolchain it was itself
  # built with, for every module, regardless of that module's `go` directive.
  # It refuses to run against a newer one. This pin and LINT_VERSION move
  # together or neither moves.
  LINT_GO_VERSION: "1.26"
  LINT_VERSION: "v2.12.2"
  GOSEC_VERSION: "v2.28.0"
  GOVULNCHECK_VERSION: "v1.7.0"
  # Fail rather than silently fetch a module whose checksum is not in the
  # transparency log, and fail rather than silently rewrite go.mod.
  GOFLAGS: -mod=readonly
  GOSUMDB: sum.golang.org

jobs:
  # -------------------------------------------------------------- build ----
  build:
    name: build & test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "redisstore"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            redisstore/go.sum

      # go.work is not committed (.gitignore): a committed workspace changes how
      # modules resolve for everyone who clones the repository. It is created
      # here so a change to the core is visible to redisstore/ without a tagged
      # release for every commit.
      - name: Create the development workspace
        run: go work init . ./redisstore

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: go test -race
        working-directory: ${{ matrix.module }}
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage
        working-directory: ${{ matrix.module }}
        run: |
          if [ -s coverage.out ]; then
            go tool cover -func=coverage.out | tail -1
          else
            echo "no coverage profile yet (module has no tests)"
          fi

  # ------------------------------------------- satellite resolution ----
  #
  # Every other job runs inside a go.work, which makes redisstore resolve the
  # core from the working tree and its `require` line inert. moat's
  # redisstore/v0.2.0 shipped broken for exactly that reason: its require still
  # named a core version whose interface it no longer satisfied. Every local
  # signal was green, and necessarily so.
  #
  # GOWORK=off means the satellite resolves the core from the module proxy at
  # the version its go.mod actually names -- the same resolution a consumer
  # gets, which is the only resolution that can catch a stale pin.
  #
  # A PR that must change a core API and its satellite consumer in one go is the
  # one case where red here is expected. Label it `cross-module-window` to skip
  # it deliberately and visibly.
  satellite-resolution:
    name: redisstore resolves the published core
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.labels.*.name, 'cross-module-window')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: redisstore/go.sum

      # No `go work init` anywhere in this job. That omission is the point of
      # it, so do not add one to make it consistent with the others.
      - name: Confirm no workspace is in effect
        working-directory: redisstore
        env:
          GOWORK: "off"
        run: |
          # `go env GOWORK` prints "off" when disabled and the workspace path
          # when one is in effect -- it is not empty in the disabled case.
          # Comparing against "off" rather than testing for emptiness reads
          # correct and is not the same check.
          gowork="$(go env GOWORK)"
          if [ "$gowork" != "off" ]; then
            echo "::error::a workspace is in effect ($gowork); this job proves nothing"
            exit 1
          fi

      - name: go mod verify
        working-directory: redisstore
        env:
          GOWORK: "off"
        run: go mod verify

      - name: go build, vet, test without the workspace
        working-directory: redisstore
        env:
          GOWORK: "off"
        run: |
          go build ./...
          go vet ./...
          go test ./...

  # ------------------------------------------------- dependency policy ----
  #
  # NFR-01 and ADR-0001. The core admits first-party dependencies, pinned
  # exactly, and no third-party ones. cairn breaks with moat and crier here --
  # they have zero -- so the promise is narrower and correspondingly easier to
  # erode by accident. It is asserted mechanically rather than trusted.
  dependency-policy:
    name: core module takes no third-party dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Every require in the core must be first-party
        run: |
          offenders=$(go list -m -f '{{if not .Main}}{{.Path}}{{end}}' all 2>/dev/null \
            | grep -v '^github.com/JonasBorgesLM/' || true)
          if [ -n "$offenders" ]; then
            echo "::error file=go.mod::the core module has acquired a third-party dependency (ADR-0001, NFR-01)"
            printf '%s\n' "$offenders"
            exit 1
          fi
          echo "core dependencies: $(go list -m -f '{{if not .Main}}{{.Path}} {{.Version}}{{end}}' all | tr -d '\n' || echo '(none)')"

      - name: The core must not import a submodule
        run: |
          if go list -deps ./... 2>/dev/null | grep -E 'cairn/redisstore'; then
            echo "::error::the core imports a submodule; the dependency arrow points one way only"
            exit 1
          fi

      - name: The core must not import net/http
        run: |
          # NFR-06. cairnhttp is excluded: importing net/http is what it is for.
          for pkg in $(go list ./... | grep -v '/cairnhttp$'); do
            if go list -deps "$pkg" | grep -qx 'net/http'; then
              echo "::error::$pkg imports net/http; only cairnhttp may (NFR-06)"
              exit 1
            fi
          done
          echo "no package outside cairnhttp reaches net/http"

      - name: moat must be pinned to an exact version
        run: |
          # ADR-0007: an automated or accidental bump of this dependency is the
          # event that ADR exists to prevent, so a pseudo-version here is a
          # failure rather than a curiosity -- it names a commit, which is an
          # unreleased state nobody reviewed.
          #
          # The module graph, not a grep of go.mod. Grepping matched the
          # comment in go.mod that names moat and read its trailing comma as a
          # version, which is how this job first went red.
          #
          # A failed `go list -m all` is an error, not an absence. Treating it
          # as "moat is not required" would make an unresolvable graph pass
          # this check silently -- the fail-open ADR-0017 exists to prevent.
          graph=$(go list -m -f '{{.Path}} {{.Version}}' all 2>&1) || {
            echo "::error::cannot resolve the core module graph"
            printf '%s\n' "$graph"
            exit 1
          }

          line=$(printf '%s\n' "$graph" | grep '^github.com/JonasBorgesLM/moat ' || true)
          if [ -z "$line" ]; then
            echo "moat is not in the module graph yet (arrives with destination.go)"
            exit 0
          fi

          version=${line#* }
          case "$version" in
            *-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-*)
              echo "::error file=go.mod::moat is at a pseudo-version ($version); it must name a release (ADR-0007)"
              exit 1 ;;
            v[0-9]*.[0-9]*.[0-9]*)
              echo "moat pinned at $version" ;;
            *)
              echo "::error file=go.mod::moat must be pinned to an exact release, found '$version' (ADR-0007)"
              exit 1 ;;
          esac

  # --------------------------------------------------------------- lint ----
  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "redisstore"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.LINT_GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # v9 of the action is the line that runs golangci-lint v2; earlier majors
      # install v1, which rejects .golangci.yml's `version: "2"` schema.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.LINT_VERSION }}
          working-directory: ${{ matrix.module }}

      - name: Install gosec ${{ env.GOSEC_VERSION }}
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      - name: gosec
        working-directory: ${{ matrix.module }}
        # -tests scans the test files too: an attack case that no longer
        # compiles is an attack case that is no longer being run.
        run: gosec -tests -exclude-generated ./...

  # ------------------------------------------------------- govulncheck ----
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "redisstore"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Deliberately not GO_VERSION -- see the comment on it above.
          go-version: ${{ env.GO_SUPPORTED_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

  # --------------------------------------------------------------- docs ----
  #
  # NFR-12 and NFR-14. Documentation here is not a nicety: requirements are
  # cited by id from ADRs, godoc and tests, and a citation pointing at nothing
  # is how a reader ends up implementing a requirement that was renumbered.
  docs:
    name: documentation is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Create the development workspace
        run: go work init . ./redisstore
      - name: Run the documentation checks
        run: ./.github/scripts/check-docs.sh

  # ---------------------------------------------------- ADR immutability ----
  #
  # NFR-14: an ADR is never rewritten. It is amended in place with a section
  # naming what superseded part of it, so the reasoning that was current at the
  # time stays readable.
  #
  # That is checkable: an amendment only ADDS lines. A rewrite removes them.
  adr-immutability:
    name: accepted ADRs are amended, never rewritten
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: An existing ADR may gain lines, never lose them
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          rewritten=""
          for f in $(git diff --name-only --diff-filter=M "$base"...HEAD -- 'docs/adr/[0-9]*.md'); do
            # --numstat is "added<TAB>deleted<TAB>path". A modified ADR with a
            # non-zero deletion count has had its reasoning edited rather than
            # extended.
            deleted=$(git diff --numstat "$base"...HEAD -- "$f" | awk '{print $2}')
            [ "${deleted:-0}" -gt 0 ] && rewritten="$rewritten $f($deleted lines removed)"
          done
          if [ -n "$rewritten" ]; then
            echo "::error::an accepted ADR was rewritten rather than amended (NFR-14):$rewritten"
            echo ""
            echo "A change of mind is a new ADR that supersedes this one, or an"
            echo "'## Amendment' section appended to it. Editing the original"
            echo "destroys the reasoning that was current when it was decided,"
            echo "which is the reason the record exists."
            echo ""
            echo "Fixing a typo is the one legitimate case: label the PR"
            echo "'adr-typo' to skip this check."
            exit 1
          fi
          echo "no accepted ADR lost a line"
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'adr-typo') }}

  # ------------------------------------------------------------ commits ----
  #
  # NFR-13. The changelog is generated from the API diff, not from commit
  # messages, so this is not about release notes -- it is about `git log` being
  # readable a year from now by someone who was not here.
  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit in this PR follows the convention
        run: |
          types='feat|fix|docs|test|refactor|perf|build|ci|chore|revert'
          scopes='cairn|policy|memstore|cairnhttp|redisstore|adr|docs|deps|ci|security'
          pattern="^($types)(\\(($scopes)\\))?!?: .+"
          base='${{ github.event.pull_request.base.sha }}'
          bad=0

          while IFS= read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            # A merge commit's subject is generated by the forge, not written.
            [ "$(git rev-list --no-walk --count --merges "$sha")" -eq 1 ] && continue

            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::not a conventional commit: $subject"
              bad=1
              continue
            fi
            if [ ${#subject} -gt 72 ]; then
              echo "::error::subject over 72 characters (${#subject}): $subject"
              bad=1
            fi
            case "$subject" in
              *.) echo "::error::subject ends with a period: $subject"; bad=1 ;;
            esac
          done < <(git rev-list "$base"..HEAD)

          if [ "$bad" -ne 0 ]; then
            echo ""
            echo "Format:  <type>(<scope>)!: <subject>"
            echo "Types:   $types"
            echo "Scopes:  $scopes"
            echo ""
            echo "  feat(policy): reject IPv4-mapped IPv6 destinations"
            echo "  fix(redisstore): use SetNX rather than SET on save"
            echo "  docs(adr): record the redirect status decision"
            echo ""
            echo "Explain WHY in the body -- the diff already says what -- and"
            echo "cite the requirement or ADR (Refs SR-18, Closes #33)."
            exit 1
          fi
          echo "all commits follow the convention"

      # The PR title becomes the commit subject on a squash merge, so it is
      # subject to the same rule. A convention enforced on commits and not on
      # the thing that replaces them is enforced nowhere.
      - name: The PR title follows the convention
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|test|refactor|perf|build|ci|chore|revert'
          scopes='cairn|policy|memstore|cairnhttp|redisstore|adr|docs|deps|ci|security'
          if ! printf '%s' "$TITLE" | grep -qE "^($types)(\\(($scopes)\\))?!?: .+"; then
            echo "::error::PR title is not a conventional commit: $TITLE"
            exit 1
          fi
          echo "PR title follows the convention"

  # -------------------------------------------------------- integration ----
  integration:
    name: integration tests (real Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: redisstore/go.sum
      - name: Create the development workspace
        run: go work init . ./redisstore

      # testcontainers starts a real Redis (NFR-10). Never miniredis: a fake
      # that implements SetNX correctly proves nothing about the server that
      # has to.
      #
      # If the suite does not exist yet, `go test` on no files is a pass, which
      # would make this job green while proving nothing. The guard makes the
      # absence visible instead.
      - name: redisstore against real Redis
        working-directory: redisstore
        run: |
          if ! grep -rql 'go:build integration' . 2>/dev/null; then
            echo "::notice::no integration suite yet (issue #38); nothing to run"
            exit 0
          fi
          go test -tags=integration -race ./...

  # -------------------------------------------------- dependency review ----
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          # A new dependency in this repository is a design decision, so
          # anything with a known vulnerability at any severity fails rather
          # than being triaged later.
          fail-on-severity: low
          # Copyleft would change the terms this library ships under.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
          comment-summary-in-pr: on-failure

  # -------------------------------------------------------------- gate ----
  #
  # A single required check to protect the branch with. Branch protection can
  # only require named jobs, and a matrix job's name changes when the matrix
  # does -- so protecting the matrix entries directly means adding a module
  # silently widens the gap between "CI passed" and "everything ran".
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - build
      - satellite-resolution
      - dependency-policy
      - lint
      - govulncheck
      - docs
      - adr-immutability
      - commits
      - integration
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Upstream results: $results"
          for r in $results; do
            # `skipped` is legitimate: PR-only jobs do not run on push.
            case "$r" in
              success|skipped) ;;
              *) echo "::error::an upstream job reported '$r'"; exit 1 ;;
            esac
          done
          echo "all upstream jobs passed or were skipped"

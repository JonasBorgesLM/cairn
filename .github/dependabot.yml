# Dependabot must be told about each module separately: it reads one go.mod per
# `directory` entry, and this repository has two. A missing entry means that
# module's dependencies are never checked, which is a silent gap rather than a
# visible failure.
version: 2

updates:
  # The core module. It admits first-party dependencies only (ADR-0001), and
  # the one it will take -- moat, for secret.Value -- is explicitly ignored
  # below. So this entry exists mainly as a tripwire: if Dependabot ever opens
  # a pull request here, something has been added that should not have been.
  # ci.yml's dependency-policy job fails on the same condition.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, core]
    commit-message:
      prefix: "build(deps)"
    ignore:
      # ADR-0007. moat is pinned to an exact version and upgraded manually,
      # verified with a build from a clean directory outside this repository --
      # the procedure usher's ADR-11 established after moat took a breaking
      # rename in a MINOR release and published a satellite tag that did not
      # compile.
      #
      # An automated bump of this dependency is precisely the event ADR-0007
      # exists to prevent, so it is not merely deprioritised here: it is off.
      - dependency-name: github.com/JonasBorgesLM/moat

  # The Redis store: go-redis, plus testcontainers for the integration suite.
  - package-ecosystem: gomod
    directory: /redisstore
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, store]
    commit-message:
      prefix: "build(deps)"
    groups:
      # Test-only tooling moves often and rarely needs individual review.
      test-tooling:
        patterns:
          - "github.com/testcontainers/*"
          - "github.com/docker/*"

  # The workflow files. Actions are pinned by major version; this keeps that pin
  # from going stale, and an action update is a supply-chain change that
  # deserves the same review as a code dependency.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci(deps)"
